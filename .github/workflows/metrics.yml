name: Metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          base: ""
          config_display: large
          config_timezone: UTC
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          config_order: isocalendar, languages
          # Dark "terminal window" look matching card.svg / habits.svg.
          # :root targets only the outer SVG; plain `svg` would also paint the
          # isocalendar and hide the stats beneath it.
          extras_css: |
            :root { box-sizing: border-box; background: #060407; border: 1px solid #2A1720; border-radius: 10px; color: #F6EFF3; }
            h1, h2, h3 { color: #F095C8 !important; }
            .field { color: #F6EFF3; }
            .field.language.details small { color: #76616B; }
            svg[viewBox="0,0 480,270"] { width: 52%; margin-top: -110px !important; }
            [fill="#ebedf0"] { fill: #2A1720; }
            [fill="#9be9a8"] { fill: #563040; }
            [fill="#40c463"] { fill: #A9C7EE; }
            [fill="#30a14e"] { fill: #F095C8; }
            [fill="#216e39"] { fill: #FFB1DD; }
